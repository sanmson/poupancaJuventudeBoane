<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  if (sessionStorage.getItem('pjb_auth') !== '1') {
    window.location.replace('login.html');
  }
</script>
<title>Poupança da Juventude Boane — Perfil do cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-950:#0C2924; --teal-900:#0F332C; --teal-800:#164138; --teal-700:#1E5548;
    --sand-100:#FFFFFF; --sand-50:#F7F6F2;
    --gold:#D9A441; --gold-dark:#A87B29;
    --coral:#C1502E; --coral-bg:#F6DDD3;
    --sage:#4F8465; --sage-bg:#DEEBE1;
    --amber-bg:#F6E9CE; --amber-text:#8A5E12;
    --ink:#17251F; --ink-soft:#4B5A54; --line: rgba(23,37,31,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand-100);color:var(--ink);font-family:'Times New Roman', Times, serif;-webkit-font-smoothing:antialiased;}
  .app{display:flex;min-height:100vh;}
  .weave{
    height:6px;width:100%;
    background-image:linear-gradient(45deg, var(--gold) 25%, transparent 25%, transparent 75%, var(--gold) 75%),
      linear-gradient(45deg, var(--gold) 25%, transparent 25%, transparent 75%, var(--gold) 75%);
    background-size:12px 12px;background-position:0 0, 6px 6px;background-color: var(--teal-700);
  }
  .sidebar{width:230px;flex-shrink:0;background:var(--teal-950);color:var(--sand-100);display:flex;flex-direction:column;padding:28px 18px;position:relative;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:36px;padding:0 4px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Times New Roman', Times, serif;font-weight:700;color:var(--teal-950);font-size:17px;}
  .brand-text{font-family:'Times New Roman', Times, serif;line-height:1.2;}
  .brand-name1{display:block;font-size:13px;font-weight:600;color:#E4A491;}
  .brand-name2{display:block;font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.03em;margin-top:1px;}
  .brand-sub{display:block;font-family:'Times New Roman',Times,serif;font-size:10.5px;color:#A9BDB4;letter-spacing:.04em;text-transform:uppercase;margin-top:3px;}
  .menu-toggle{display:none;background:none;border:1px solid rgba(255,255,255,0.25);color:var(--sand-100);font-size:18px;line-height:1;padding:8px 11px;border-radius:8px;cursor:pointer;margin-left:auto;}
  .menu-toggle:hover{background:var(--teal-900);}
  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:#C7D6CF;text-decoration:none;border:none;background:none;cursor:pointer;font-family:inherit;text-align:left;width:100%;}
  .nav-item svg{flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:var(--teal-900);color:var(--sand-50);}
  .nav-item.active{background:var(--teal-800);color:var(--sand-50);}
  .nav-item.active svg{opacity:1;}
  .sidebar-foot{margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.08);}
  main{flex:1;min-width:0;}
  .topbar{background:var(--sand-50);padding:22px 34px 18px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;}
  .topbar h1{font-family:'Times New Roman', Times, serif;font-weight:700;font-size:22px;margin:0;}
  .back-link{font-size:12.5px;color:var(--ink-soft);text-decoration:none;}
  .back-link:hover{color:var(--ink);}
  .content{padding:28px 34px 48px;max-width:960px;}
  .panel-title{font-family:'Times New Roman', Times, serif;font-size:15.5px;font-weight:700;margin:0 0 12px;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .profile-head{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .avatar-big{
    width:56px;height:56px;border-radius:50%;background:var(--gold-dark);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;
  }
  .profile-head h2{margin:0;font-size:20px;font-weight:700;}
  .profile-head .sub{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;margin-left:6px;}
  .pill.ok{background:var(--sage-bg);color:#2F5E43;}
  .pill.gone{background:rgba(23,37,31,0.08);color:var(--ink-soft);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  .info-card{background:var(--sand-50);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .info-card h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 12px;font-weight:600;}
  .info-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);}
  .info-row:first-of-type{border-top:none;}
  .info-row .k{color:var(--ink-soft);}

  .empty-state{
    background:var(--sand-50);border:1px dashed var(--line);border-radius:14px;
    padding:26px;text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:24px;
  }
  .btn{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:9px;padding:10px 20px;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-block;}
  .btn-primary{background:var(--teal-950);color:var(--sand-50);}
  .btn-primary:hover{background:var(--teal-800);}
  .not-found{padding:40px;text-align:center;color:var(--ink-soft);}

  @media (max-width: 880px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 18px;flex-wrap:wrap;}
    .menu-toggle{display:block;}
    nav{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      right:0;
      background:var(--teal-950);
      flex-direction:column;
      padding:10px 18px 18px;
      z-index:50;
      box-shadow:0 8px 16px rgba(0,0,0,0.25);
    }
    nav.open{display:flex;}
    .content{padding:20px;}
    .topbar{padding:18px 20px;}
    .grid-2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-text"><span class="brand-name1">Poupança da Juventude</span><span class="brand-name2">BOANE</span><span class="brand-sub">Sistema interno</span></div>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <nav id="mainNav">
      <a href="index.html" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Painel geral</a>
      <a href="clientes.html" class="nav-item active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg>Clientes</a>
      <a href="funcionarios.html" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M8 17c0-2 1.8-3 4-3s4 1 4 3"/></svg>Funcionários</a>
      <a href="auditoria.html" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Auditoria</a>
      <a href="poupancas.html" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Poupanças</a>
      <a href="creditos.html" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M6 15l4-5 3 3 5-6"/></svg>Créditos</a>
      <a href="cobrancas.html" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>Cobranças</a>
      <a href="relatorios.html" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>Relatórios</a>
    </nav>
    <div class="sidebar-foot">
      <a href="#" id="logout-link" class="nav-item" style="color:#C7D6CF;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sair
      </a>
    </div>
  </aside>

  <main>
    <div class="weave"></div>
    <div class="topbar">
      <h1>Perfil do cliente</h1>
      <a href="clientes.html" class="back-link">← Voltar a Clientes</a>
    </div>

    <div class="content" id="conteudo">
      <!-- preenchido via JavaScript -->
    </div>
  </main>
</div>

<script>
  function getClientes() {
    try { return JSON.parse(localStorage.getItem('pjb_clientes')) || []; }
    catch (e) { return []; }
  }

  function formatarData(iso) {
    if (!iso) return '—';
    const [ano, mes, dia] = iso.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const cliente = getClientes().find(c => c.id === id);
  const conteudo = document.getElementById('conteudo');

  if (!cliente) {
    conteudo.innerHTML = `
      <div class="not-found">
        <p>Não foi possível encontrar este cliente.</p>
        <a href="clientes.html" class="btn btn-primary" style="margin-top:10px;">Voltar à lista de clientes</a>
      </div>
    `;
  } else {
    const iniciais = cliente.nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
    const pillClass = cliente.estado === 'Eliminado' ? 'gone' : 'ok';

    conteudo.innerHTML = `
      <div class="profile-head">
        <div class="avatar-big">${iniciais}</div>
        <div>
          <h2>${cliente.nome} <span class="pill ${pillClass}">${cliente.estado}</span></h2>
          <p class="sub">Cliente Nº <span class="mono">${cliente.id}</span></p>
        </div>
      </div>

      <div class="grid-2">
        <div class="info-card">
          <h3>Identificação</h3>
          <div class="info-row"><span class="k">Data de nascimento</span><span>${formatarData(cliente.nascimento)}</span></div>
          <div class="info-row"><span class="k">Número do B.I.</span><span class="mono">${cliente.bi || '—'}</span></div>
          <div class="info-row"><span class="k">Emissão do B.I.</span><span>${formatarData(cliente.biEmissao)}</span></div>
          <div class="info-row"><span class="k">Validade do B.I.</span><span>${formatarData(cliente.biValidade)}</span></div>
          <div class="info-row"><span class="k">NUIT</span><span class="mono">${cliente.nuit || '—'}</span></div>
        </div>

        <div class="info-card">
          <h3>Contactos</h3>
          <div class="info-row"><span class="k">Número alternativo 1</span><span>${cliente.contacto1 || '—'}</span></div>
          <div class="info-row"><span class="k">Número alternativo 2</span><span>${cliente.contacto2 || '—'}</span></div>
        </div>
      </div>

      <p class="panel-title">Poupança</p>
      <div class="empty-state">Nenhuma conta de poupança registada ainda para este cliente.</div>

      <p class="panel-title">Créditos</p>
      <div class="empty-state">Nenhum crédito registado ainda para este cliente.</div>

      <p class="panel-title">Prestações</p>
      <div class="empty-state">Nenhuma prestação registada ainda para este cliente.</div>
    `;
  }

  const logoutLink = document.getElementById('logout-link');
  if (logoutLink) {
    logoutLink.addEventListener('click', (e) => {
      e.preventDefault();
      try {
        const log = JSON.parse(localStorage.getItem('pjb_auditoria')) || [];
        log.unshift({ data: new Date().toISOString(), utilizador: sessionStorage.getItem('pjb_user') || '—', acao: 'Saiu do sistema' });
        localStorage.setItem('pjb_auditoria', JSON.stringify(log.slice(0, 300)));
      } catch (err) {}
      sessionStorage.removeItem('pjb_auth');
      sessionStorage.removeItem('pjb_user');
      window.location.href = 'login.html';
    });
  }

  if (sessionStorage.getItem('pjb_role') !== 'admin') {
    document.querySelectorAll('a[href="funcionarios.html"], a[href="auditoria.html"]').forEach(el => el.remove());
  }
</script>

<script>
  // Menu hamburguer para telemovel: mostra/esconde a navegacao
  const menuToggle = document.getElementById('menuToggle');
  const mainNav = document.getElementById('mainNav');
  if (menuToggle && mainNav) {
    menuToggle.addEventListener('click', () => {
      const aberto = mainNav.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', aberto ? 'true' : 'false');
    });
    mainNav.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        mainNav.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }
</script>
</body>
</html>
